name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build .tar.gz
        run: |
          set -euo pipefail
          PKG="ddnsondemand-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${PKG}"
          cp target/release/ddnsondemand "dist/${PKG}/"
          cp README.md README.zh-CN.md LICENSE "dist/${PKG}/"
          cp -r examples "dist/${PKG}/"
          tar -czf "dist/${PKG}.tar.gz" -C dist "${PKG}"
          rm -rf "dist/${PKG}"

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        # Reuse the already-built release binary instead of rebuilding.
        run: cargo deb --no-build --output dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
