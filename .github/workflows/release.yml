name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: glibc (.tar.gz + .deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build .tar.gz
        run: |
          set -euo pipefail
          PKG="ddnsondemand-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${PKG}"
          cp target/release/ddnsondemand "dist/${PKG}/"
          cp README.md README.zh-CN.md LICENSE "dist/${PKG}/"
          cp -r examples "dist/${PKG}/"
          tar -czf "dist/${PKG}.tar.gz" -C dist "${PKG}"
          rm -rf "dist/${PKG}"

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        # Reuse the already-built release binary instead of rebuilding.
        run: cargo deb --no-build --output dist/

      - name: Generate checksums
        run: |
          cd dist
          for f in *; do sha256sum "$f" > "$f.sha256"; done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256

  musl:
    name: musl static (.tar.gz + .apk)
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build static musl binary (Alpine)
        # rust:alpine targets x86_64-unknown-linux-musl, which links the CRT
        # statically by default; build-base provides the C compiler ring needs.
        #
        # pack-relative-relocs stores the static-pie's relocations as RELR
        # (~180 KB -> ~2 KB). It is safe here because the binary is static: its
        # own musl (>= 1.2.4) startup code applies them, so nothing on the target
        # system needs to understand RELR. Do not add it to the glibc build: that
        # would require glibc >= 2.36 at runtime.
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e RUSTFLAGS="-C link-arg=-Wl,-z,pack-relative-relocs" \
            rust:alpine \
            sh -c 'apk add --no-cache build-base && cargo build --release --locked'

      - name: Smoke-test static binary
        # Static, so it runs on the Ubuntu runner; catches a broken link/startup.
        run: target/release/ddnsondemand --version

      - name: Build .tar.gz
        run: |
          set -euo pipefail
          PKG="ddnsondemand-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl"
          mkdir -p "dist/${PKG}"
          cp target/release/ddnsondemand "dist/${PKG}/"
          cp README.md README.zh-CN.md LICENSE "dist/${PKG}/"
          cp -r examples "dist/${PKG}/"
          tar -czf "dist/${PKG}.tar.gz" -C dist "${PKG}"
          rm -rf "dist/${PKG}"

      - name: Build .apk
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p apkroot dist
          cp target/release/ddnsondemand examples/config.yaml README.md LICENSE \
             examples/ddnsondemand.openrc apkroot/
          cp packaging/apk/APKBUILD apkroot/APKBUILD
          sed -i "s/^pkgver=.*/pkgver=${VER}/" apkroot/APKBUILD
          docker run --rm -v "$PWD/apkroot":/pkg -w /pkg alpine:3.21 sh -c '
            apk add --no-cache abuild &&
            abuild-keygen -a -n &&
            abuild -F checksum &&
            abuild -F -P /pkg/out rootpkg'
          find apkroot/out -name '*.apk' -exec cp {} dist/ \;

      - name: Generate checksums
        run: |
          cd dist
          for f in *; do sha256sum "$f" > "$f.sha256"; done

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.apk
            dist/*.sha256
